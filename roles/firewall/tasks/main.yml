---
- name: Install ufw
  ansible.builtin.package:
    name: ufw
    state: present
  when: firewall.enabled | bool
  failed_when: false

- name: Default deny incoming / allow outgoing
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }
  when: firewall.enabled | bool
  failed_when: false

- name: Allow selected TCP ports
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ firewall.allow_tcp }}"
  when: firewall.enabled | bool
  failed_when: false

- name: Enable ufw
  community.general.ufw:
    state: enabled
  when: firewall.enabled | bool
  failed_when: false
