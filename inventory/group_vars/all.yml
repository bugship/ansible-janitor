---
timezone: UTC

common_packages:
  - curl
  - git
  - htop
  - vim
  - ca-certificates
  - unattended-upgrades

project_users:
  - name: app
    groups: ["sudo"]
    shell: /bin/bash
    state: present
    # Replace with a real public key before applying
    ssh_key: "ssh-ed25519 AAAA...replace-me app@laptop"
  - name: contractor
    groups: []
    shell: /usr/sbin/nologin
    state: absent
    ssh_key: ""

sshd:
  port: 22
  permit_root_login: "no"
  password_authentication: "no"
  pubkey_authentication: "yes"
  max_auth_tries: 3
  client_alive_interval: 300

firewall:
  enabled: true
  allow_tcp:
    - 22
    - 80
    - 443
